<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Média | ETE Palmares</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="palco">
    <section class="chamada">
      <p class="escola">ETE Palmares</p>
      <h1>Calcule sua média aqui</h1>
      <p class="apoio">Digite as três notas e descubra na hora como você está.</p>
    </section>

    <form class="calculadora" id="formulario" novalidate>
      <div class="campo">
        <label for="nota1">1ª nota</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0,0">
      </div>
      <div class="campo">
        <label for="nota2">2ª nota</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0,0">
      </div>
      <div class="campo">
        <label for="nota3">3ª nota</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1" inputmode="decimal" placeholder="0,0">
      </div>

      <button type="submit">Calcular média</button>
      <button type="button" class="limpar" id="limpar">Limpar</button>

      <div class="resultado" id="resultado" aria-live="polite">
        <span class="valor" id="valor">–</span>
        <span class="situacao" id="situacao">Sua média aparece aqui</span>
      </div>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
